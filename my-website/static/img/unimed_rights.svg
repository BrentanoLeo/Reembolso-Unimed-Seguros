<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" role="img" aria-label="Conheça seus direitos">
  <!-- Ground shadow -->
  <ellipse cx="260" cy="348" rx="185" ry="15" fill="#e6f5ee" opacity="0.7"/>

  <!-- Shield outer glow -->
  <path d="M260 42 L370 90 L370 210 Q370 290 260 340 Q150 290 150 210 L150 90 Z" fill="#00A859" opacity="0.12"/>

  <!-- Shield body -->
  <path d="M260 55 L358 98 L358 206 Q358 278 260 325 Q162 278 162 206 L162 98 Z" fill="#00A859"/>

  <!-- Shield inner highlight -->
  <path d="M260 75 L340 112 L340 204 Q340 265 260 305 Q180 265 180 204 L180 112 Z" fill="#007a40"/>

  <!-- Shield center emblem - large checkmark -->
  <circle cx="260" cy="195" r="55" fill="rgba(255,255,255,0.12)"/>
  <polyline points="235,195 252,215 288,172" fill="none" stroke="white" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Stars/sparkles around shield -->
  <!-- Top right sparkle -->
  <g transform="translate(385, 85)">
    <polygon points="0,-12 3,-4 11,-4 5,2 7,10 0,5 -7,10 -5,2 -11,-4 -3,-4" fill="#00A859" opacity="0.6"/>
  </g>

  <!-- Left sparkle -->
  <g transform="translate(118, 180)">
    <polygon points="0,-9 2.5,-3 9,-3 4,1.5 6,8 0,4 -6,8 -4,1.5 -9,-3 -2.5,-3" fill="#00A859" opacity="0.5"/>
  </g>

  <!-- Bottom right sparkle -->
  <g transform="translate(400, 280)">
    <polygon points="0,-8 2,-2.5 8,-2.5 3.5,1.5 5,7 0,3.5 -5,7 -3.5,1.5 -8,-2.5 -2,-2.5" fill="#00A859" opacity="0.45"/>
  </g>

  <!-- Info badge bottom left -->
  <circle cx="158" cy="295" r="28" fill="#e6f5ee" stroke="#00A859" stroke-width="2.5"/>
  <text x="158" y="303" font-family="Georgia, serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#00A859">i</text>

  <!-- Small person silhouette top left -->
  <circle cx="110" cy="105" r="18" fill="#cce9d9"/>
  <circle cx="110" cy="97" r="7" fill="#00A859"/>
  <path d="M96 123 Q110 115 124 123" fill="#00A859"/>
</svg>
