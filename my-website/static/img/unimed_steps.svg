<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" role="img" aria-label="Passo a passo simples">
  <!-- Background shape -->
  <ellipse cx="260" cy="340" rx="200" ry="18" fill="#e6f5ee" opacity="0.7"/>

  <!-- Clipboard body -->
  <rect x="130" y="60" width="220" height="290" rx="14" fill="#ffffff" stroke="#d0ead9" stroke-width="2"/>
  <rect x="130" y="60" width="220" height="50" rx="14" fill="#00A859"/>
  <rect x="130" y="90" width="220" height="20" rx="0" fill="#00A859"/>

  <!-- Clipboard clip -->
  <rect x="210" y="42" width="80" height="36" rx="10" fill="#007a40"/>
  <rect x="226" y="52" width="48" height="16" rx="6" fill="#00A859"/>

  <!-- Header text lines (white) -->
  <rect x="155" y="72" width="120" height="11" rx="4" fill="rgba(255,255,255,0.7)"/>
  <rect x="155" y="88" width="80" height="8" rx="4" fill="rgba(255,255,255,0.4)"/>

  <!-- Checklist item 1 - checked -->
  <rect x="155" y="135" width="24" height="24" rx="6" fill="#00A859"/>
  <polyline points="159,147 163,153 176,140" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="190" y="140" width="130" height="10" rx="4" fill="#cce9d9"/>
  <rect x="190" y="154" width="90" height="8" rx="4" fill="#e8f5ef"/>

  <!-- Checklist item 2 - checked -->
  <rect x="155" y="178" width="24" height="24" rx="6" fill="#00A859"/>
  <polyline points="159,190 163,196 176,183" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="190" y="183" width="115" height="10" rx="4" fill="#cce9d9"/>
  <rect x="190" y="197" width="100" height="8" rx="4" fill="#e8f5ef"/>

  <!-- Checklist item 3 - unchecked -->
  <rect x="155" y="221" width="24" height="24" rx="6" fill="none" stroke="#b3d9c4" stroke-width="2"/>
  <rect x="190" y="226" width="125" height="10" rx="4" fill="#e8f5ef"/>
  <rect x="190" y="240" width="85" height="8" rx="4" fill="#f0faf5"/>

  <!-- Checklist item 4 - unchecked -->
  <rect x="155" y="264" width="24" height="24" rx="6" fill="none" stroke="#b3d9c4" stroke-width="2"/>
  <rect x="190" y="269" width="110" height="10" rx="4" fill="#e8f5ef"/>
  <rect x="190" y="283" width="75" height="8" rx="4" fill="#f0faf5"/>

  <!-- Pencil -->
  <g transform="rotate(-35, 360, 300)">
    <rect x="350" y="250" width="16" height="70" rx="3" fill="#007a40"/>
    <polygon points="350,320 366,320 358,340" fill="#ffd166"/>
    <rect x="350" y="250" width="16" height="12" rx="2" fill="#005c30"/>
  </g>

  <!-- Small checkmark badge -->
  <circle cx="390" cy="140" r="26" fill="#00A859" opacity="0.15"/>
  <circle cx="390" cy="140" r="20" fill="#00A859"/>
  <polyline points="381,140 387,147 400,132" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
